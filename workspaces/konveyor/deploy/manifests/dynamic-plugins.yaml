apiVersion: v1
kind: ConfigMap
metadata:
  name: dynamic-plugins-rhdh
  labels:
    rhdh.redhat.com/ext-config-sync: "true"
  annotations:
    rhdh.redhat.com/backstage-name: developer-hub
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      - package: "oci://__IMAGE__!red-hat-developer-hub-backstage-plugin-migration-intelligence"
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              red-hat-developer-hub.backstage-plugin-migration-intelligence:
                dynamicRoutes:
                  - path: /migration-intelligence
                    importName: MigrationIntelligencePage
                    menuItem:
                      text: "Migration Intelligence"
                      icon: migrationIcon
                appIcons:
                  - name: migrationIcon
                    importName: MigrationIcon
      - package: "oci://__IMAGE__!red-hat-developer-hub-backstage-plugin-migration-intelligence-backend"
        disabled: false
