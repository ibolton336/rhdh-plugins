apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: migration-agent
  namespace: rhdh
spec:
  params:
    - name: source-repo
      type: string
      description: Git repo URL to migrate
    - name: source-branch
      type: string
      default: main
    - name: target-branch
      type: string
      default: migration-output
    - name: skill
      type: string
      default: java-ee-to-quarkus
      description: Goose skill to run
    - name: llm-provider
      type: string
      default: ""
      description: "LLM provider (e.g. anthropic, openai, ollama)"
    - name: github-token
      type: string
      default: ""
      description: "GitHub token from user auth session for pushing and PR creation"
  workspaces:
    - name: source
  steps:
    - name: clone
      image: alpine/git:latest
      env:
        - name: GITHUB_TOKEN
          value: $(params.github-token)
      script: |
        #!/bin/sh
        set -ex
        cd $(workspaces.source.path)

        # If we have a GitHub token, use it for authenticated clone
        REPO_URL="$(params.source-repo)"
        if [ -n "$GITHUB_TOKEN" ]; then
          # Convert https://github.com/org/repo to https://x-access-token:TOKEN@github.com/org/repo
          REPO_URL=$(echo "$REPO_URL" | sed "s|https://github.com/|https://x-access-token:${GITHUB_TOKEN}@github.com/|")
        fi

        git clone --branch $(params.source-branch) "$REPO_URL" repo
        cd repo
        git checkout -b $(params.target-branch)
    - name: migrate
      image: quay.io/ibolton/migration-agent:latest
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: SKILL
          value: $(params.skill)
        - name: SOURCE_REPO
          value: $(params.source-repo)
        - name: TARGET_BRANCH
          value: $(params.target-branch)
        - name: GOOSE_PROVIDER
          value: $(params.llm-provider)
        - name: GITHUB_TOKEN
          value: $(params.github-token)
      command:
        - /opt/entrypoint.sh
    - name: push-results
      image: alpine/git:latest
      workingDir: $(workspaces.source.path)/repo
      env:
        - name: GITHUB_TOKEN
          value: $(params.github-token)
      script: |
        #!/bin/sh
        set -ex
        git config user.email "migration-agent@konveyor.io"
        git config user.name "Migration Agent"

        if [ -n "$(git status --porcelain)" ]; then
          git add -A
          git commit -m "feat: automated migration via konveyor skill"

          if [ -n "$GITHUB_TOKEN" ]; then
            # Rewrite remote to use the token for auth
            CURRENT_URL=$(git remote get-url origin)
            AUTH_URL=$(echo "$CURRENT_URL" | sed "s|https://github.com/|https://x-access-token:${GITHUB_TOKEN}@github.com/|")
            git remote set-url origin "$AUTH_URL"
            git push origin $(params.target-branch)
            echo "✅ Pushed branch $(params.target-branch) to origin"

            # Install gh CLI for PR creation
            apk add --no-cache github-cli 2>/dev/null || true
            if command -v gh >/dev/null 2>&1; then
              echo "$GITHUB_TOKEN" | gh auth login --with-token
              gh pr create \
                --title "feat: migration via konveyor skill ($(params.skill))" \
                --body "Automated migration created by Konveyor Migration Intelligence.

**Skill:** $(params.skill)
**Source branch:** $(params.source-branch)
**Target branch:** $(params.target-branch)

This PR was generated by the migration agent." \
                --base $(params.source-branch) \
                --head $(params.target-branch) || echo "PR creation failed (may already exist)"
            else
              echo "⚠️ gh CLI not available — branch pushed but PR not created"
            fi
          else
            echo "⚠️ No GITHUB_TOKEN — changes committed locally but not pushed."
            echo "Branch: $(params.target-branch)"
          fi
        else
          echo "No changes detected after migration."
        fi
